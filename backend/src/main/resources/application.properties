spring.application.name=dockmind-backend

server.address=0.0.0.0
server.port=8080

# File-mode H2: receipts survive a restart with no database install.
spring.datasource.url=jdbc:h2:file:${DOCKMIND_DATA:./data}/dockmind;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
